<meta charset="utf-8">
<style>
:root{--ink:#1f1d1a;--bg:#e4e4df;--iris:#eef2f3;--slate:#8d979c}
body{margin:0;background:var(--bg);font:14px sans-serif;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:24px}
.c{display:grid;justify-items:center;gap:14px}
.row{display:flex;gap:18px;align-items:end}
.dk{background:#1c1e20;--ink:#ede5d3;padding:10px;border-radius:8px}
.tile{width:64px;height:64px;border-radius:14px;background:#24211e;display:grid;place-items:center}
.tile svg{--ink:#f2efe8}
</style>
